<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Netto Forfettario - Rider</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-6 px-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-lg p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Calcolatore Netto Forfettario</h1>

        <form id="calculatorForm" class="space-y-4">
            <!-- Incasso Lordo -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Incasso Lordo (€)</label>
                <input type="number" step="0.01" name="gross_income" required
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Es. 15000">
            </div>

            <!-- Codice ATECO (بدون افتراضي) -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Codice ATECO</label>
                <select name="ateco_code" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
                    <option value="" disabled selected>Seleziona codice ATECO</option>
                    <option value="53.20.00">53.20.00 (Delivery / Spedizioni)</option>
                    <option value="82.99.99">82.99.99 (Altri servizi di supporto)</option>
                </select>
            </div>

            <!-- Aliquota Imposta Sostitutiva (بدون افتراضي) -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Aliquota Imposta Sostitutiva</label>
                <select name="tax_rate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-700">
                    <option value="" disabled selected>Seleziona aliquota</option>
                    <option value="0.05">5% (Nuove attività / Regime startup)</option>
                    <option value="0.15">15% (Regime forfettario standard)</option>
                </select>
            </div>

            <!-- Spese Mezzo -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Spese Mezzo (€)</label>
                <input type="number" step="0.01" name="vehicle_expense"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Inserisci spesa (es. carburante, manutenzione)">
            </div>

            <!-- Assicurazione mezzo -->
            <div>
                <label class="block text-gray-700 text-sm font-bold mb-2">Assicurazione mezzo (€)</label>
                <input type="number" step="0.01" name="insurance"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Inserisci costo assicurazione">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                Calcola Netto
            </button>
        </form>

        <!-- Result Box -->
        <div id="resultContainer" class="mt-6 hidden bg-gray-50 p-4 rounded-lg border border-gray-200">
            <h2 class="text-lg font-bold text-gray-800 mb-2">Risultato:</h2>
            <div id="resultContent" class="text-gray-700 space-y-1 text-sm">
                <!-- Risultati dinamici -->
            </div>
        </div>
    </div>
</body>
</html>
