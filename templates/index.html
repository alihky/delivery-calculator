<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Netto Rider Regime Forfettario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 22px; text-align: center; margin-bottom: 25px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; margin-bottom: 15px; }
        button { width: 100%; background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #result { font-size: 18px; text-align: center; margin-top: 20px; padding: 15px; border-radius: 5px; background: #e9ecef; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calcolatore Netto Rider Regime Forfettario</h1>

        <label>Incasso lordo totale:</label>
        <input type="number" id="total_income" step="any">

        <label>P. IVA Regime Forfettario (5% o 15%):</label>
        <select id="tax_rate">
            <option value="" disabled selected>-- Seleziona aliquota --</option>
            <option value="5">5%</option>
            <option value="15">15%</option>
        </select>

        <label>Codice ATECO:</label>
        <select id="ateco_code">
            <option value="" disabled selected>-- Seleziona codice ATECO --</option>
            <option value="53.20.00">53.20.00 (Gestione Separata - % variabile)</option>
            <option value="82.99.99">82.99.99 (Commercianti - Contributo fisso)</option>
        </select>

        <label>Per quanti mesi hai incassato questa somma (<span style="color: red;">inclusi i mesi di pausa o ferie</span>):</label>
        <input type="number" id="how_many_months" min="1" max="12">

        <label>Spese del mezzo di trasporto giornaliere (auto, moto, bici, ecc. - opzionale):</label>
        <input type="number" id="car_expenses_per_day" step="any" oninput="toggleDaysField()" placeholder="Es. 5">

        <div id="days_container" style="display: none;">
            <label>Giorni lavorati totali:</label>
            <input type="number" id="how_many_days_worked" min="0" max="365">
        </div>

        <label>Assicurazione mezzo annuale (opzionale):</label>
        <input type="number" id="car_insurance" step="any" placeholder="Es. 400">

        <button onclick="sendData()">Calcola Netto Totale</button>

        <h2 id="result" style="color: blue;">Il risultato apparirà qui...</h2>
    </div>

<script>
    // Mostra/Nasconde il campo dei giorni lavorati
    function toggleDaysField() {
        var expenses = document.getElementById("car_expenses_per_day").value;
        var daysContainer = document.getElementById("days_container");
        if (expenses !== "" && parseFloat(expenses) > 0) {
            daysContainer.style.display = "block";
        } else {
            daysContainer.style.display = "none";
            document.getElementById("how_many_days_worked").value = "";
        }
    }

    // Invia i dati al backend
    async function sendData() {
        const payload = {
            total_income: document.getElementById("total_income").value,
            tax_rate: document.getElementById("tax_rate").value,
            ateco_code: document.getElementById("ateco_code").value,
            how_many_months: document.getElementById("how_many_months").value,
            car_expenses_per_day: document.getElementById("car_expenses_per_day").value || 0,
            how_many_days_worked: document.getElementById("how_many_days_worked").value || 0,
            car_insurance: document.getElementById("car_insurance").value || 0
        };

        if (!payload.total_income || !payload.tax_rate || !payload.ateco_code || !payload.how_many_months) {
            document.getElementById("result").innerText = "Compila tutti i campi obbligatori.";
            document.getElementById("result").style.color = "red";
            return;
        }

        document.getElementById("result").innerText = "Calcolo in corso...";
        document.getElementById("result").style.color = "black";

        try {
            // Nota: Se il tuo endpoint FastAPI in backend si chiama diversamente, cambia '/calcola' qui sotto
            const response = await fetch('/calcola', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                const data = await response.json();
                document.getElementById("result").innerText = "Netto Totale: € " + data.netto; // Adatta 'data.netto' in base alla risposta del tuo Python
                document.getElementById("result").style.color = "blue";
            } else {
                document.getElementById("result").innerText = "Errore dal server.";
                document.getElementById("result").style.color = "red";
            }
        } catch (error) {
            document.getElementById("result").innerText = "Errore di connessione.";
            document.getElementById("result").style.color = "red";
        }
    }
</script>
</body>
</html>
